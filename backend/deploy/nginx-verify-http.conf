# ══════════════════════════════════════════════════════════
# USAM Hub — TEMPORARY HTTP-only Nginx (pre-cutover verification)
# Serves the Hub SPA + proxies API/socket on port 80 of the NEW box.
# Used to verify the new server via `curl -H "Host: hub.usamif.com"` and an
# SSH tunnel BEFORE any DNS change or public TLS. Replaced by the production
# nginx.conf (TLS, hub.usamif.com) at cutover time.
#
# This does NOT listen as default_server beyond what's needed and only answers
# for the Hub host; it does not affect any other server or the old box.
# ══════════════════════════════════════════════════════════

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name hub.usamif.com _;

    client_max_body_size 20M;

    # API — reverse proxy to Node backend
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Socket.io
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:3000;
    }

    # Swagger docs
    location /api/docs {
        proxy_pass http://127.0.0.1:3000;
    }

    # React SPA — static files
    location / {
        root  /var/www/html/usam-hub;
        index index.html;
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    location ~ /\. { deny all; }
}
